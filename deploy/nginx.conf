# Portfolio + demos on nginx: one static root, one SPA fallback per bundle.
#
# Save as /etc/nginx/snippets/portfolio.conf and pull it into a server block:
#
#   server {
#       listen 443 ssl http2;
#       server_name portfolio.example.com;
#       include /etc/nginx/snippets/portfolio.conf;
#   }
#
# Built with VITE_BASE=/ (nginx can rewrite, so there is no reason to nest the
# site under a subpath). If you do serve it from one, keep VITE_BASE and the
# location prefixes below identical.

root /srv/portfolio/dist;
index index.html;

charset utf-8;
gzip_static on;

# Filenames are content-hashed, so these can never go stale.
location ~ ^/(?:demos/[^/]+/)?assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Demo photos: big, immutable in practice, but not hashed.
location ~ ^/demos/[^/]+/media/ {
    access_log off;
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# The entry documents must revalidate or a deploy stays invisible: they are what
# point at the new hashed bundles.
location ~ ^/(?:demos/[^/]+/)?(?:index|404)\.html$ {
    add_header Cache-Control "no-cache";
}

# Each demo is its own SPA. Falling back to *its* index.html rather than the
# site's is the whole trick — /demos/printomato/devices must boot the console.
# The named capture is what keeps this rule demo-agnostic.
location ~ ^/demos/(?<demo>[^/]+)/ {
    try_files $uri $uri/ /demos/$demo/index.html;
}

# Everything else is the portfolio shell.
location / {
    try_files $uri $uri/ /index.html;
}
