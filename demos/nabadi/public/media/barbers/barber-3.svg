<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="b3t">
  <title id="b3t">Zurab Nadiradze, straight-razor shaves</title>
  <rect width="400" height="400" fill="#f1ead9"/>
  <circle cx="200" cy="200" r="156" fill="#e6dec9" stroke="#d6cdb4" stroke-width="2"/>

  <g stroke="#20180f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 212 L170 298 L230 298 L226 212 Z" fill="#fbf6ec"/>
    <path d="M46 400 C48 346 86 312 134 300 C154 295 166 293 176 291 C182 306 218 306 224 291 C234 293 246 295 266 300 C314 312 352 346 354 400 Z" fill="#fbf6ec"/>
    <path d="M176 291 L200 318 L224 291" fill="none"/>
