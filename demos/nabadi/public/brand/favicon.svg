<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nabadi Barbershop">
  <title>Nabadi Barbershop</title>
  <!--
    The symbol alone, cut down for 16-32px. The drape folds and the collar line of the
    primary mark are sub-pixel here and only muddy the shape, so what is left is the
    cloak outline — long shoulder slopes, a neck cut opened wider than the logo's so it
    survives the pixel grid, a felt hem — plus one caramel clasp drawn oversize so it
    still reads as a dot at 16px. Cream ground with a 1px oat keyline so the tile
    separates on a white tab strip.
  -->
  <rect width="32" height="32" rx="6" fill="#f1ead9"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#d6cdb4"/>
  <path fill="#20180f" d="M5,9.4 L11,7.4 C13,15.4 19,15.4 21,7.4 L27,9.4 L25,23.4 C24.86,24.3 24.1,25 23.1,25 L8.9,25 C7.9,25 7.14,24.3 7,23.4 Z"/>
  <circle cx="16" cy="18.6" r="2.2" fill="#8f5d33"/>
</svg>
