<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f0e6" />
    <title>Sinji - live demo</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="A live, fully interactive demo of Sinji: AI review of support calls with a transcript timeline, knowledge-base fact-check, weighted rubric scorecards, tone analysis, a grounded copilot and an operator console - served entirely from your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sinji - live demo" />
    <meta property="og:description" content="Every call heard. Every score proven." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Stamp the theme before first paint (no storage: the OS preference decides).
      ;(function () {
        try {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #f4f0e6; color: #1b1915; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #12110f; color: #efe8dc; }
      #root { min-height: 100vh; }
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot-splash svg { width: 56px; height: 56px; opacity: 0.9; }
      .boot-splash path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: boot-draw 1.1s cubic-bezier(.2,.8,.2,1) infinite alternate; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash path { animation: none; stroke-dashoffset: 0; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M6 34 C15 34 15.5 9 24 9 C32.5 9 33 34 42 34" stroke="#0d6b5a" stroke-width="3.5" stroke-linecap="round" />
          <line x1="4" y1="34" x2="44" y2="34" stroke="#0d6b5a" stroke-width="1.75" stroke-linecap="round" />
          <circle cx="24" cy="44" r="3" fill="#985722" />
        </svg>
      </div>
    </div>
    <noscript>This demo is a JavaScript application. Please enable JavaScript to run it.</noscript>
  </body>
</html>
